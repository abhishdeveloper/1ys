<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <rect width="600" height="600" fill="#f6f5f3"/>

    <!-- Decorative Border -->
    <rect x="20" y="20" width="560" height="560" fill="none" stroke="#e0ddd5" stroke-width="2"/>
    <rect x="26" y="26" width="548" height="548" fill="none" stroke="#e0ddd5" stroke-width="1"/>

    <!-- Central Icon / Floral motif abstraction -->
    <g transform="translate(300, 260)" fill="#c27b3b">
        <path d="M0 -40 C 20 -40, 40 -20, 40 0 C 40 20, 20 40, 0 40 C -20 40, -40 20, -40 0 C -40 -20, -20 -40, 0 -40 Z" opacity="0.2"/>
        <path d="M0 -25 C 10 -25, 25 -10, 25 0 C 25 10, 10 25, 0 25 C -10 25, -25 10, -25 0 C -25 -10, -10 -25, 0 -25 Z" opacity="0.5"/>
        <circle cx="0" cy="0" r="8" fill="#c27b3b"/>

        <!-- Cross / No Image indicator -->
        <line x1="-30" y1="-30" x2="30" y2="30" stroke="#c27b3b" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Text -->
    <text x="300" y="340" font-family="'Playfair Display', serif, sans-serif" font-size="24" font-weight="600" fill="#1a3622" text-anchor="middle" letter-spacing="2">AAYU CARE</text>
    <text x="300" y="370" font-family="'Lato', sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="middle" letter-spacing="1">IMAGE NOT AVAILABLE</text>
</svg>